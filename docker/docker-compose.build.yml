services:
  # 前端构建服务
  frontend-builder:
    image: dockerpull.pw/node:16-alpine
    networks:
      - media-net
    volumes:
      - ../web_src:/build
      - ./nginx/dist:/build/dist
      - ./nginx/config.js:/build/config.js:ro
    working_dir: /build
    command: >
      sh -c "npm --registry=https://registry.npmmirror.com install &&
             npm run build &&
             rm -f /build/dist/static/js/config.js &&
             cp /build/config.js /build/dist/static/js/"

  # gb28181-client测试工具
  gb28181-client:
    build:
      context: ..
      dockerfile: docker/gb28181-client/Dockerfile
    image: local/gb28181-client:latest
    networks:
      - media-net
    depends_on:
      - polaris-wvp
    ports:
      - "8081:8081"

  polaris-redis:
    image: dockerpull.pw/redis:alpine
    networks:
      - media-net
    volumes:
      - ./redis/conf/redis.conf:/opt/polaris/redis/redis.conf
      - ./volumes/redis/data:/data
    ports:
      - "6379:6379"
    command: redis-server /opt/polaris/redis/redis.conf --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  polaris-mysql:
    image: dockerpull.pw/mysql:8.0
    networks:
      - media-net
    environment:
      MYSQL_DATABASE: wvp
      MYSQL_ROOT_PASSWORD: root
#      MYSQL_USER: wvp
#      MYSQL_PASSWORD: wvp
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ../数据库/2.7.3/初始化-mysql-2.7.3.sql:/docker-entrypoint-initdb.d/init.sql
      - ./volumes/mysql/data:/var/lib/mysql
      - ./logs/mysql:/logs
    command: [
      'mysqld',
      '--default-authentication-plugin=mysql_native_password',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_general_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1'
    ]
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/3306"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  polaris-media:
    image: dockerpull.pw/zlmediakit/zlmediakit:master
    networks:
      - media-net
    volumes:
      - ./media/config.ini:/opt/media/conf/config.ini
      - ./volumes/video:/opt/media/www/record
      - ./logs/media:/opt/media/log
    ports:
      # RTMP 端口
      - "1935:1935"
      # HTTP API 端口
      - "6080:6080"
      # HTTPS API 端口
      - "8443:443"
      # RTSP 端口
      - "5540:5540"
      # RTP 代理端口
      - "10000:10000"
      - "10000:10000/udp"
      - "15060:15060/udp"
      - "10000-10050:10000-10050/udp"
      # WebRTC 端口
      - "8000:8000/udp"
      # SRT 端口
      - "9000:9000/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/index/api/getServerConfig"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  polaris-wvp:
    build:
      context: ..
      dockerfile: docker/wvp/Dockerfile.simple
    image: local/polaris-wvp:v2025052701
    networks:
      - media-net
    depends_on:
      - polaris-redis
      - polaris-mysql
      - polaris-media
    volumes:
      - ./wvp/wvp/:/opt/wvp/wvp/
      - ./logs/wvp:/opt/wvp/logs/
    ports:
      - "18978:18978"
      - "8116:8116/udp"
      - "8116:8116/tcp"
    environment:
      TZ: "Asia/Shanghai"
      # 数据库配置
      DATABASE_HOST: polaris-mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      # Redis配置
      REDIS_HOST: polaris-redis
      REDIS_PORT: 6379
      # ZLM配置
      ZLM_HOST: polaris-media
      ZLM_PORT: 6080
      ZLM_SERCERT: su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf
      # SIP配置
      SIP_HOST: 0.0.0.0
      STREAM_HOST: 192.168.1.68
      # 前端跨域配置
      NGINX_HOST: http://127.0.0.1:18080

  polaris-nginx:
    image: dockerpull.pw/nginx:alpine
    networks:
      - media-net
    depends_on:
      - polaris-wvp
      - frontend-builder
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dist:/opt/dist:ro
    ports:
      - "18080:8080"

networks:
  media-net:
    driver: bridge 